name: build-vcaa-niabd-synergy-artifact

on:
  push:
    branches:
      - artifact/vcaa-niabd-synergy-fix-20260818
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Reconstruct reviewed deterministic patcher
        run: |
          cat tools/synergy_fix_chunks/00.b64 \
              tools/synergy_fix_chunks/01.b64 \
              tools/synergy_fix_chunks/02.b64 \
              tools/synergy_fix_chunks/03.b64 \
              tools/synergy_fix_chunks/04.b64 > /tmp/synergy_patcher.b64
          test "$(wc -c < /tmp/synergy_patcher.b64)" -eq 11772
          echo 'd9797f6b0717a22e38a574b0f801366c429fd54176c0aeaf42d6de618f6a39a7  /tmp/synergy_patcher.b64' | sha256sum -c -
          python - <<'PY'
          import base64
          import pathlib
          import zlib
          src = pathlib.Path('/tmp/synergy_patcher.b64').read_text().strip()
          decoded = zlib.decompress(base64.b64decode(src))
          path = pathlib.Path('tools/apply_vcaa_niabd_synergy_fix.py')
          path.write_bytes(decoded)
          assert path.stat().st_size == 39557
          text = path.read_text()
          corrections = [
              (
                  "    start = '''    @staticmethod\\n    def _upper_robust_z(\\n'''",
                  "    start = '''    @staticmethod\\n    def _upper_robust_z'''",
                  "compact _upper_robust_z signature",
              ),
              (
                  "    end = '''    def _safe_reference(\\n'''",
                  "    end = '''    def _safe_reference'''",
                  "compact _safe_reference signature",
              ),
              (
                  '    text = replace_once(text, old, new, "niabd metric recovery risk")',
                  '    text = text.replace(old, new, 1)',
                  "two-path NIABD metrics replacement",
              ),
          ]
          for old, new, label in corrections:
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected one patcher marker, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Apply synergy fix to exact reviewed base
        run: python tools/apply_vcaa_niabd_synergy_fix.py --repo .
      - name: Preserve server ownership and schema-compatible labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('niabd.py')
          text = path.read_text()
          old = '        if reference_items == action_knowledge:\n'
          new = (
              '        same_reference = (\n'
              '            len(reference_items) == len(action_knowledge)\n'
              '            and all(\n'
              '                left is right\n'
              '                for left, right in zip(reference_items, action_knowledge)\n'
              '            )\n'
              '        )\n'
              '        if same_reference:\n'
          )
          if text.count(old) != 1:
              raise RuntimeError(f'generated cohort identity marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('federated_server.py')
          text = path.read_text()
          old_name = '_defense_reference_client_ids'
          if text.count(old_name) < 3:
              raise RuntimeError('expected generated defense reference identifier')
          path.write_text(text.replace(old_name, '_defense_reference_ids'))

          path = Path('vcaa.py')
          text = path.read_text()
          old_label = 'hard_valid_historical_median_minus_mad_floor'
          if text.count(old_label) != 1:
              raise RuntimeError(f'VCAA threshold source count={text.count(old_label)}')
          path.write_text(
              text.replace(old_label, 'historical_median_minus_mad_floor', 1)
          )
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static compile check
        run: python -B -m compileall -q .
      - name: Full regression suite
        run: python -B -m pytest -q
      - name: Validate experiment matrix generation
        run: python -B scripts/run_v3_matrix.py --config configs/main_backdoor_experiment.json
      - name: Diff hygiene
        run: git diff --check
      - name: Assert algorithm lineage
        run: |
          python - <<'PY'
          import niabd, vcaa, result_schema
          assert vcaa.VCAA_ALGORITHM_VERSION == result_schema.VCAA_ALGORITHM_VERSION
          assert niabd.NIABD_ALGORITHM_VERSION == result_schema.NIABD_ALGORITHM_VERSION
          assert vcaa.VCAA_ALGORITHM_VERSION == 'vcaa-v6-unbiased-hard-valid-history'
          assert niabd.NIABD_ALGORITHM_VERSION == 'niabd-v4-dual-cohort-consensus-recovery'
          PY
      - name: Build complete source zip
        run: |
          rm -rf __pycache__ .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf tools/synergy_fix_chunks
          rm -f tools/apply_vcaa_niabd_synergy_fix.py.zlib.b64
          rm -f .github/workflows/build_synergy_artifact.yml
          zip -qr FL_VCCA-NIABD_vcaa_niabd_synergy_fix_20260818.zip . \
            -x '.git/*' 'dataset/*' 'smoke_results/*' 'experiment_result/*' \
               'experiment_results/*' '*.pyc' '.pytest_cache/*'
          sha256sum FL_VCCA-NIABD_vcaa_niabd_synergy_fix_20260818.zip > \
            FL_VCCA-NIABD_vcaa_niabd_synergy_fix_20260818.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FL_VCCA-NIABD_vcaa_niabd_synergy_fix_20260818
          path: |
            FL_VCCA-NIABD_vcaa_niabd_synergy_fix_20260818.zip
            FL_VCCA-NIABD_vcaa_niabd_synergy_fix_20260818.zip.sha256
          if-no-files-found: error
          retention-days: 30
