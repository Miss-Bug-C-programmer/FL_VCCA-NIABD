name: fedagg-v3

on:
  push:
  pull_request:

jobs:
  protocol-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m compileall -q .
      - run: python -B -m pytest -q
      - run: python -B scripts/run_v3_matrix.py --config configs/main_backdoor_experiment.json
      - run: python -B scripts/verify_preserved_main.py
