name: export-source
on:
  push:
    branches: [chatgpt-export-backdoor]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('FL_VCCA-NIABD-source.zip')
          skip = {'.git'}
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  if any(part in skip for part in p.parts):
                      continue
                  zf.write(p, p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: FL_VCCA-NIABD-source.zip
          if-no-files-found: error
